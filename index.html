/* =========================================================
   EVENTS
   ========================================================= */
function attachScreenEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    state.screen = b.dataset.nav;
    if(state.screen==='new') state.screen='typepick';
    render();
  });
  const logout = document.querySelector('[data-action="logout"]');
  if(logout) logout.onclick = ()=>{ state.session=null; state.screen='login'; state.loginStep='section'; state.loginGroup=null; state.loginEngineer=null; render(); };

  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ state.screen=b.dataset.goto; render(); });

  document.querySelectorAll('[data-start-type]').forEach(b=>b.onclick=()=>{
    state.form = newFormState(b.dataset.startType);
    state.screen='new'; render();
  });

  if(state.screen==='new') attachFormEvents();
  if(state.screen==='report') attachReportEvents();
  if(state.screen==='admin') attachAdminEvents();
  if(state.screen==='acts') attachActDownloadButtons();
  if(state.screen==='actSaved'){
    const bindDl = (id, fn)=>{
      const btn = document.getElementById(id);
      if(!btn) return;
      btn.onclick = async ()=>{
        btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Формування…';
        try{ await fn(state.lastActRecord); showToast('Акт завантажено','✅'); }
        catch(e){ console.error(e); showToast('Помилка: '+(e && e.message ? e.message : e), '⚠️', 6000); }
        btn.disabled = false; btn.textContent = orig;
      };
    };
    bindDl('act-download-pdf', downloadActPDF);
    bindDl('act-download-docx', downloadActDOCX);
    const doneBtn = document.getElementById('act-done');
    if(doneBtn) doneBtn.onclick = ()=>{ state.lastActRecord=null; state.screen='home'; render(); };
  }
}

function attachFormEvents(){
  const f = state.form;

  document.getElementById('f-date').onchange = e=>{ f.date=e.target.value; };
  const secSel = document.getElementById('f-section');
  if(secSel) secSel.onchange = e=>{ f.section=e.target.value; };
  document.getElementById('f-batch').onchange = e=>{ f.batch=e.target.value; };
  document.getElementById('f-expiry').onchange = e=>{ f.expiry=e.target.value; };

  // Trademark combo — sourced from ГП catalog when this is проміжний контроль,
  // since the engineer anchors on the finished product first.
  const anchorType = f.controlType==='pf' ? 'gp' : f.controlType;
  const tmInput = document.getElementById('f-tm-input');
  const showTmList = ()=>{
    const q = tmInput.value.trim().toLowerCase();
    const opts = trademarksForType(anchorType).filter(t=>t.toLowerCase().includes(q));
    renderComboList('f-tm-list', opts.map(t=>({value:t,label:t})), 'Нічого не знайдено');
    document.querySelectorAll('#f-tm-list .combo-item').forEach(it=>{
      it.onclick = ()=>{
        f.trademark = it.dataset.val; f.tmQuery = it.dataset.val;
        f.gpProductCode=''; f.gpProductName=''; f.gpProdQuery='';
        f.productCode=''; f.productName=''; f.prodQuery=''; f.normValue='';
        hideCombo('f-tm-list'); render();
      };
    });
  };
  tmInput.oninput = ()=>{ f.tmQuery=tmInput.value; f.trademark=''; showTmList(); };
  tmInput.onfocus = showTmList;
  tmInput.onblur = ()=>setTimeout(()=>hideCombo('f-tm-list'),150);

  // Готова продукція combo (проміжний контроль only) — picking this narrows
  // the напівфабрикат list below to the matching trademark.
  const gpProdInput = document.getElementById('f-gpprod-input');
  if(gpProdInput){
    const showGpProdList = ()=>{
      const q = gpProdInput.value.trim().toLowerCase();
      const opts = productsForType('gp').filter(p=>p.trademark===f.trademark && (p.name.toLowerCase().includes(q)||p.code.includes(q)));
      renderComboList('f-gpprod-list', opts.slice(0,40).map(p=>({value:p.code,label:p.name,sub:'код '+p.code})), 'Нічого не знайдено');
      document.querySelectorAll('#f-gpprod-list .combo-item').forEach(it=>{
        it.onclick = ()=>{
          const p = state.catalog.products.find(x=>x.code===it.dataset.val && x.type==='gp');
          f.gpProductCode = p.code; f.gpProductName = p.name; f.gpProdQuery = p.name;
          f.productCode=''; f.productName=''; f.prodQuery=''; f.normValue='';
          hideCombo('f-gpprod-list'); render();
        };
      });
    };
    gpProdInput.oninput = ()=>{ f.gpProdQuery=gpProdInput.value; f.gpProductCode=''; f.gpProductName=''; showGpProdList(); };
    gpProdInput.onfocus = showGpProdList;
    gpProdInput.onblur = ()=>setTimeout(()=>hideCombo('f-gpprod-list'),150);
  }

  // Product combo — for проміжний контроль this picks the напівфабрикат
  // (filtered by trademark, enabled only after готова продукція is chosen);
  // for готова продукція control it picks the ГП item directly, as before.
  const prodInput = document.getElementById('f-prod-input');
  if(prodInput){
    const showProdList = ()=>{
      const q = prodInput.value.trim().toLowerCase();
      const sourceType = f.controlType==='pf' ? 'pf' : f.controlType;
      const opts = productsForType(sourceType).filter(p=>p.trademark===f.trademark && (p.name.toLowerCase().includes(q)||p.code.includes(q)));
      renderComboList('f-prod-list', opts.slice(0,40).map(p=>({value:p.code,label:p.name,sub:'код '+p.code+(p.normValue?` · норма ${p.normValue} ${p.normUnit}`:'')})), 'Нічого не знайдено');
      document.querySelectorAll('#f-prod-list .combo-item').forEach(it=>{
        it.onclick = ()=>{
          const p = state.catalog.products.find(x=>x.code===it.dataset.val && x.type===sourceType);
          f.productCode = p.code; f.productName = p.name; f.prodQuery = p.name;
          if(p.normValue){ f.normValue = p.normValue; f.normUnit = p.normUnit || f.normUnit; }
          hideCombo('f-prod-list'); render();
        };
      });
    };
    prodInput.oninput = ()=>{ f.prodQuery=prodInput.value; f.productCode=''; f.productName=''; showProdList(); };
    prodInput.onfocus = showProdList;
    prodInput.onblur = ()=>setTimeout(()=>hideCombo('f-prod-list'),150);
  }

  // Equipment combo (only rendered for проміжний контроль)
  const eqInput = document.getElementById('f-equip-input');
  if(eqInput){
    const showEqList = ()=>{
      const q = eqInput.value.trim().toLowerCase();
      const opts = (state.catalog.equipment||[]).filter(e=>e.toLowerCase().includes(q));
      renderComboList('f-equip-list', opts.map(e=>({value:e,label:e})), q?'Немає збігів — можна ввести нову назву':'Почніть вводити…');
      document.querySelectorAll('#f-equip-list .combo-item').forEach(it=>{
        it.onclick = ()=>{ f.equipment=it.dataset.val; eqInput.value=it.dataset.val; hideCombo('f-equip-list'); };
      });
    };
    eqInput.oninput = ()=>{ f.equipment=eqInput.value; showEqList(); };
    eqInput.onfocus = showEqList;
    eqInput.onblur = ()=>setTimeout(()=>hideCombo('f-equip-list'),150);
  }

  // Operations chips
  document.querySelectorAll('[data-op]').forEach(chip=>{
    chip.onclick = ()=>{
      const op = chip.dataset.op;
      if(f.ops.includes(op)) f.ops = f.ops.filter(o=>o!==op); else f.ops.push(op);
      render();
    };
  });

  // Norm
  document.getElementById('f-norm').oninput = e=>{ f.normValue=e.target.value; evalToleranceHint(f); };
  document.getElementById('f-normunit').onchange = e=>{ f.normUnit=e.target.value; evalToleranceHint(f); };

  // Netto/brutto
  document.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{ f.netBrutto=b.dataset.nb; render(); });

  // Measurements
  document.querySelectorAll('[data-meas-idx]').forEach(inp=>{
    inp.oninput = ()=>{ f.measurements[+inp.dataset.measIdx]=inp.value; evalToleranceHint(f); };
  });
  document.querySelectorAll('[data-meas-rm]').forEach(b=>b.onclick=()=>{
    f.measurements.splice(+b.dataset.measRm,1); render();
  });
  const addMeas = document.getElementById('f-meas-add');
  if(addMeas) addMeas.onclick = ()=>{ f.measurements.push(''); render(); };

  evalToleranceHint(f);

  // Compliance
  document.querySelectorAll('[data-comp]').forEach(el=>{
    el.classList.toggle('selected', f.compliance===el.dataset.comp);
    el.onclick = ()=>{ f.compliance=el.dataset.comp; render(); };
  });

  // Comment
  document.getElementById('f-comment').oninput = e=>{ f.comment=e.target.value; };

  // Appearance checklist, deviation permit, non-compliance act, photos — now used by both control types
  {
    document.querySelectorAll('[data-appearance]').forEach(el=>{
      el.onclick = ()=>{ f.appearanceChecks[el.dataset.appearance] = el.dataset.appval; render(); };
    });
    const permitToggle = document.getElementById('f-permit-toggle');
    if(permitToggle) permitToggle.querySelectorAll('[data-permit]').forEach(b=>{
      b.onclick = ()=>{ f.permitEnabled = (b.dataset.permit==='yes'); render(); };
    });
    const permitNum = document.getElementById('f-permit-number');
    if(permitNum) permitNum.oninput = e=>{ f.permitNumber=e.target.value; };
    const permitDate = document.getElementById('f-permit-date');
    if(permitDate) permitDate.onchange = e=>{ f.permitDate=e.target.value; };
    const permitDesc = document.getElementById('f-permit-desc');
    if(permitDesc) permitDesc.oninput = e=>{ f.permitDesc=e.target.value; };

    // Continuation-of-inspection
    const contToggle = document.getElementById('f-continue-toggle');
    if(contToggle) contToggle.querySelectorAll('[data-continue]').forEach(b=>{
      b.onclick = ()=>{
        f.showContinuePicker = (b.dataset.continue==='yes');
        if(!f.showContinuePicker) f.continuesFrom='';
        render();
      };
    });
    const contPick = document.getElementById('f-continue-pick');
    if(contPick) contPick.onchange = e=>{
      f.continuesFrom = e.target.value;
      const rec = state.records.find(r=>r.id===f.continuesFrom);
      if(rec){
        f.trademark = rec.trademark; f.tmQuery = rec.trademark;
        f.productCode = rec.productCode; f.productName = rec.productName; f.prodQuery = rec.productName;
        f.batch = rec.batch; f.expiry = rec.expiry;
        if(rec.controlType==='pf'){
          f.gpProductCode = rec.gpProductCode||''; f.gpProductName = rec.gpProductName||''; f.gpProdQuery = rec.gpProductName||'';
        }
      }
      render();
    };
    const contNote = document.getElementById('f-continue-note');
    if(contNote) contNote.oninput = e=>{ f.continuationNote=e.target.value; };

    // Act fields
    const actNum = document.getElementById('f-act-number');
    if(actNum) actNum.oninput = e=>{ f.actNumber=e.target.value; };
    const actDate = document.getElementById('f-act-date');
    if(actDate) actDate.onchange = e=>{ f.actDate=e.target.value; };
    document.querySelectorAll('[data-actstage]').forEach(b=>{
      b.onclick = ()=>{ f.actDiscoveryStage=b.dataset.actstage; render(); };
    });
    const actSpec = document.getElementById('f-act-spec');
    if(actSpec) actSpec.oninput = e=>{ f.actSpecNumber=e.target.value; };
    const actSemiDate = document.getElementById('f-act-semidate');
    if(actSemiDate) actSemiDate.onchange = e=>{ f.actSemiDate=e.target.value; };
    const actTotalQty = document.getElementById('f-act-totalqty');
    if(actTotalQty) actTotalQty.oninput = e=>{ f.actTotalQty=e.target.value; };
    const actTotalUnit = document.getElementById('f-act-totalunit');
    if(actTotalUnit) actTotalUnit.onchange = e=>{ f.actTotalQtyUnit=e.target.value; };
    const actDefectQty = document.getElementById('f-act-defectqty');
    if(actDefectQty) actDefectQty.oninput = e=>{ f.actDefectQty=e.target.value; };
    const actDefectUnit = document.getElementById('f-act-defectunit');
    if(actDefectUnit) actDefectUnit.onchange = e=>{ f.actDefectQtyUnit=e.target.value; };
    document.querySelectorAll('[data-actnc]').forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset.actnc;
        if(f.actNonComplianceTypes.includes(id)) f.actNonComplianceTypes = f.actNonComplianceTypes.filter(x=>x!==id);
        else f.actNonComplianceTypes.push(id);
        render();
      };
    });
    const ncOther = document.getElementById('f-act-nc-other');
    if(ncOther) ncOther.oninput = e=>{ f.actNonComplianceOther=e.target.value; };
    const actDesc = document.getElementById('f-act-desc');
    if(actDesc) actDesc.oninput = e=>{ f.actDesc=e.target.value; };
    document.querySelectorAll('[data-actcause]').forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset.actcause;
        if(f.actCauseCategories.includes(id)) f.actCauseCategories = f.actCauseCategories.filter(x=>x!==id);
        else f.actCauseCategories.push(id);
        render();
      };
    });
    const actCauseDetail = document.getElementById('f-act-causedetail');
    if(actCauseDetail) actCauseDetail.oninput = e=>{ f.actCauseDetail=e.target.value; };
    const actRespPos = document.getElementById('f-act-resp-pos');
    if(actRespPos) actRespPos.oninput = e=>{ f.actResponsiblePosition=e.target.value; };
    const actRespName = document.getElementById('f-act-resp-name');
    if(actRespName) actRespName.oninput = e=>{ f.actResponsibleName=e.target.value; };
    document.querySelectorAll('[data-actstatus]').forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset.actstatus;
        if(f.actStatusOptions.includes(id)) f.actStatusOptions = f.actStatusOptions.filter(x=>x!==id);
        else f.actStatusOptions.push(id);
        render();
      };
    });
    const actActions = document.getElementById('f-act-actions');
    if(actActions) actActions.oninput = e=>{ f.actActions=e.target.value; };

    const photoInput = document.getElementById('f-act-photo-input');
    if(photoInput) photoInput.onchange = async ()=>{
      const files = Array.from(photoInput.files || []).slice(0, 4 - f.actPhotos.length);
      if(files.length===0) return;
      showToast('Обробка фото…', '📷', 2000);
      for(const file of files){
        try{
          const resized = await resizeImageFile(file);
          f.actPhotos.push(resized);
        }catch(e){ console.error(e); showToast('Не вдалося обробити фото: '+file.name, '⚠️'); }
      }
      render();
    };
    document.querySelectorAll('[data-act-photo-rm]').forEach(b=>{
      b.onclick = ()=>{ f.actPhotos.splice(+b.dataset.actPhotoRm, 1); render(); };
    });
  }

  // Tare weight (both control types, only meaningful in brutto mode)
  const tareInput = document.getElementById('f-tare');
  if(tareInput) tareInput.oninput = e=>{ f.tareWeight=e.target.value; render(); evalToleranceHint(state.form); };

  // Save
  document.getElementById('f-save').onclick = async ()=>{
    if(!f.section){ showToast('Оберіть дільницю','⚠️'); return; }
    if(!f.trademark){ showToast('Оберіть торгову марку','⚠️'); return; }
    if(f.controlType==='pf' && !f.gpProductName){ showToast('Оберіть готову продукцію','⚠️'); return; }
    if(!f.productName){ showToast(f.controlType==='pf' ? 'Оберіть напівфабрикат' : 'Оберіть продукцію','⚠️'); return; }
    if(!f.batch){ showToast('Вкажіть партію (дату НФ)','⚠️'); return; }
    if(!f.compliance){ showToast('Оберіть відповідність','⚠️'); return; }
    let appOverall = '';
    {
      const items = appearanceItemsFor(f.controlType);
      if(items.some(it=>!f.appearanceChecks[it.id])){ showToast('Заповніть усі пункти відповідності','⚠️'); return; }
      appOverall = appearanceOverall(f.appearanceChecks, items);
      if(appOverall==='fail' && !f.actDesc.trim()){ showToast('Опишіть невідповідність в акті','⚠️'); return; }
      if(f.permitEnabled && !f.permitNumber.trim()){ showToast('Вкажіть номер дозволу на відхилення','⚠️'); return; }
    }
    const saveBtn = document.getElementById('f-save');
    saveBtn.disabled = true; saveBtn.textContent = 'Зберігаємо…';
    const record = {
      date: f.date, time: nowTime(),
      engineer: state.session.name,
      section: f.section,
      controlType: f.controlType,
      trademark: f.trademark, productCode: f.productCode, productName: f.productName,
      batch: f.batch, expiry: f.expiry,
      ops: f.ops.slice(),
      normValue: f.normValue, normUnit: f.normUnit,
      netBrutto: f.netBrutto,
      tareWeight: f.tareWeight,
      measurements: f.measurements.slice(),
      netMeasurements: nettoValues(f).map(v=>Math.round(v*100)/100),
      compliance: f.compliance,
      equipment: f.equipment,
      comment: f.comment,
    };
    if(f.controlType==='pf'){
      record.gpProductCode = f.gpProductCode;
      record.gpProductName = f.gpProductName;
    }
    if(f.controlType==='gp'){
      record.continuesFrom = f.continuesFrom || null;
      record.continuationNote = f.continuationNote || '';
    }
    {
      record.appearanceChecks = Object.assign({}, f.appearanceChecks);
      record.appearanceOverall = appOverall;
      record.permit = f.permitEnabled ? {number:f.permitNumber, date:f.permitDate, desc:f.permitDesc} : null;
      record.act = appOverall==='fail' ? {
        number:f.actNumber, date:f.actDate,
        discoveryStage:f.actDiscoveryStage,
        specNumber:f.actSpecNumber, semiDate:f.actSemiDate,
        totalQty:f.actTotalQty, totalQtyUnit:f.actTotalQtyUnit,
        defectQty:f.actDefectQty, defectQtyUnit:f.actDefectQtyUnit,
        nonComplianceTypes:f.actNonComplianceTypes.slice(), nonComplianceOther:f.actNonComplianceOther,
        desc:f.actDesc,
        causeCategories:f.actCauseCategories.slice(), causeDetail:f.actCauseDetail,
        responsiblePosition:f.actResponsiblePosition, responsibleName:f.actResponsibleName,
        statusOptions:f.actStatusOptions.slice(),
        actions:f.actActions,
        assignedBy: state.session.name,
        photos: f.actPhotos.slice(),
      } : null;
    }
    // Saved as its own Firestore document — the live listener will add it to
    // state.records automatically, no manual push needed.
    const ok = await saveNewRecord(record);
    if(ok){
      showToast('Запис збережено','✅');
      state.form = newFormState(f.controlType);
      if(record.act){
        state.lastActRecord = record;
        state.screen = 'actSaved';
      } else {
        state.screen = 'home';
      }
      render();
    } else {
      saveBtn.disabled = false; saveBtn.textContent = 'Зберегти запис';
    }
  };
}

function attachActDownloadButtons(){
  document.querySelectorAll('[data-download-act]').forEach(b=>{
    b.onclick = async ()=>{
      const rec = state.records.find(r=>r.id===b.dataset.downloadAct);
      if(!rec){ showToast('Запис не знайдено','⚠️'); return; }
      const fmt = b.dataset.format || 'pdf';
      b.disabled = true; const orig = b.textContent; b.textContent = 'Формування…';
      try{
        if(fmt==='docx') await downloadActDOCX(rec); else await downloadActPDF(rec);
        showToast('Акт завантажено','✅');
      }
      catch(e){ console.error(e); showToast('Помилка: '+(e && e.message ? e.message : e), '⚠️', 6000); }
      b.disabled = false; b.textContent = orig;
    };
  });
}

function attachReportEvents(){
  document.getElementById('rep-date').onchange = e=>{ state.reportDate=e.target.value; render(); };
  document.getElementById('rep-eng').onchange = e=>{ state.reportEngineer=e.target.value; render(); };
  const secSel = document.getElementById('rep-section');
  if(secSel) secSel.onchange = e=>{ state.reportSection=e.target.value; state.reportEngineer='all'; render(); };
  document.querySelectorAll('#rep-type-toggle [data-reptype]').forEach(b=>{
    b.onclick = ()=>{ state.reportControlType=b.dataset.reptype; state.reportEngineer='all'; render(); };
  });

  attachActDownloadButtons();

  const getRecs = ()=>{
    let recs = reportBaseRecs(state.reportDate);
    if(state.reportEngineer!=='all') recs = recs.filter(r=>r.engineer===state.reportEngineer);
    return recs.slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  };

  const xlsxBtn = document.getElementById('rep-xlsx');
  if(xlsxBtn) xlsxBtn.onclick = async ()=>{
    xlsxBtn.disabled=true; xlsxBtn.textContent='Формування…';
    try{ await exportXLSX(getRecs(), state.reportDate); showToast('Excel-файл готовий','✅'); }
    catch(e){ console.error(e); showToast('Помилка: '+(e && e.message ? e.message : e), '⚠️', 6000); }
    xlsxBtn.disabled=false; xlsxBtn.textContent='⬇️ Excel';
  };
  const pdfBtn = document.getElementById('rep-pdf');
  if(pdfBtn) pdfBtn.onclick = async ()=>{
    pdfBtn.disabled=true; pdfBtn.textContent='Формування…';
    try{ await exportPDF(getRecs(), state.reportDate); showToast('PDF-файл готовий','✅'); }
    catch(e){ console.error(e); showToast('Помилка: '+(e && e.message ? e.message : e), '⚠️', 6000); }
    pdfBtn.disabled=false; pdfBtn.textContent='⬇️ PDF';
  };
  const copyBtn = document.getElementById('rep-copy');
  if(copyBtn) copyBtn.onclick = async ()=>{
    const text = buildReportText(getRecs(), state.reportDate);
    try{ await navigator.clipboard.writeText(text); showToast('Текст скопійовано','📋'); }
    catch(e){ showToast('Не вдалося скопіювати','⚠️'); }
  };
}

function attachAdminEvents(){
  document.querySelectorAll('[data-admintab]').forEach(b=>b.onclick=()=>{ state.adminTab=b.dataset.admintab; render(); });

  if(state.adminTab==='products'){
    const search = document.getElementById('admin-prod-search');
    if(search){
      search.oninput = ()=>{ state.productSearch=search.value; render(); document.getElementById('admin-prod-search').focus(); };
    }
    document.querySelectorAll('[data-edit-product]').forEach(row=>{
      row.onclick = ()=>editProductPrompt(row.dataset.editProduct);
    });
    const addBtn = document.getElementById('admin-add-product');
    if(addBtn) addBtn.onclick = ()=>addProductPrompt();
  }

  if(state.adminTab==='equipment'){
    const addBtn = document.getElementById('add-equip-btn');
    if(addBtn) addBtn.onclick = async ()=>{
      const inp = document.getElementById('new-equip');
      const v = inp.value.trim();
      if(!v){ showToast('Введіть назву обладнання','⚠️'); return; }
      state.catalogMeta.equipment = state.catalogMeta.equipment||[];
      state.catalogMeta.equipment.push(v);
      rebuildCatalogProducts();
      await saveCatalog(); render();
    };
    document.querySelectorAll('[data-rm-equip]').forEach(b=>b.onclick=async()=>{
      state.catalogMeta.equipment.splice(+b.dataset.rmEquip,1);
      rebuildCatalogProducts();
      await saveCatalog(); render();
    });
  }

  if(state.adminTab==='engineers'){
    document.querySelectorAll('#new-eng-role [data-role]').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#new-eng-role [data-role]').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
    document.querySelectorAll('[data-section-chip]').forEach(chip=>{
      chip.onclick = ()=>{ document.getElementById('new-eng-section').value = chip.dataset.sectionChip; };
    });
    const addBtn = document.getElementById('add-eng-btn');
    if(addBtn) addBtn.onclick = async ()=>{
      const nameInp = document.getElementById('new-eng-name');
      const pinInp = document.getElementById('new-eng-pin');
      const sectionInp = document.getElementById('new-eng-section');
      const roleBtn = document.querySelector('#new-eng-role [data-role].selected');
      const name = nameInp.value.trim(); const pin = pinInp.value.trim();
      const role = roleBtn ? roleBtn.dataset.role : 'engineer';
      const section = sectionInp.value.trim();
      if(!name){ showToast('Введіть ПІБ','⚠️'); return; }
      if(!/^\d{4}$/.test(pin)){ showToast('PIN має складатись з 4 цифр','⚠️'); return; }
      if(role==='engineer' && !section){ showToast('Вкажіть дільницю для інженера','⚠️'); return; }
      state.catalogMeta.engineers = state.catalogMeta.engineers||[];
      state.catalogMeta.engineers.push({name, pin, role, section});
      rebuildCatalogProducts();
      await saveCatalog(); render();
    };
    document.querySelectorAll('[data-rm-eng]').forEach(b=>b.onclick=async()=>{
      state.catalogMeta.engineers.splice(+b.dataset.rmEng,1);
      rebuildCatalogProducts();
      await saveCatalog(); render();
    });

    const bulkBtn = document.getElementById('bulk-eng-btn');
    if(bulkBtn) bulkBtn.onclick = async ()=>{
      const raw = document.getElementById('bulk-eng').value;
      const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
      if(lines.length===0){ showToast('Вставте хоча б один рядок','⚠️'); return; }
      let added = 0, skipped = [];
      state.catalogMeta.engineers = state.catalogMeta.engineers||[];
      lines.forEach(line=>{
        const parts = line.split(/[;,]/).map(p=>p.trim());
        const name = parts[0];
        const pin = (parts[1]||'').replace(/\D/g,'');
        const rest = parts.slice(2).filter(p=>p!=='');
        const role = rest.some(p=>/адмін|admin|начальник/i.test(p)) ? 'admin' : 'engineer';
        const section = rest.find(p=>!/адмін|admin|начальник/i.test(p)) || '';
        if(!name || !/^\d{4}$/.test(pin) || (role==='engineer' && !section)){ skipped.push(line); return; }
        state.catalogMeta.engineers.push({name, pin, role, section});
        added++;
      });
      if(added>0){ rebuildCatalogProducts(); await saveCatalog(); }
      document.getElementById('bulk-eng').value = skipped.join('\n');
      showToast(skipped.length ? `Додано ${added}, пропущено ${skipped.length} (перевірте формат — інженеру потрібна дільниця)` : `Додано ${added}`, added?'✅':'⚠️', 6000);
      render();
    };
    const finishBtn = document.querySelector('[data-action="finish-bootstrap"]');
    if(finishBtn) finishBtn.onclick = ()=>{
      state.session=null; state.screen='login'; render();
    };
  }
}

function editProductPrompt(code){
  const p = state.catalog.products.find(x=>x.code===code);
  if(!p) return;
  const nv = prompt(`Норма для «${p.name}»\n(об'єм або маса, число):`, p.normValue||'');
  if(nv===null) return;
  const nu = prompt(`Одиниця (г / кг / мл / л):`, p.normUnit||'г');
  if(nu===null) return;
  state.catalogMeta.productOverrides = state.catalogMeta.productOverrides || {};
  state.catalogMeta.productOverrides[code] = {normValue: nv.trim(), normUnit: nu.trim()};
  rebuildCatalogProducts();
  saveCatalog().then(()=>{ showToast('Норму збережено','✅'); render(); });
}

function addProductPrompt(){
  const name = prompt('Найменування продукції:');
  if(!name) return;
  const trademark = prompt('Торгова марка:');
  if(!trademark) return;
  const type = confirm('Це напівфабрикат? ОК = напівфабрикат, Скасувати = готова продукція') ? 'pf':'gp';
  const code = 'M'+Date.now().toString(36);
  state.catalogMeta.customProducts = state.catalogMeta.customProducts || [];
  state.catalogMeta.customProducts.push({code, name, trademark, type, normValue:'', normUnit:'г'});
  rebuildCatalogProducts();
  saveCatalog().then(()=>{ showToast('Позицію додано','✅'); state.adminTab='products'; render(); });
}

/* =========================================================
   GO
   ========================================================= */
init();
</script>
