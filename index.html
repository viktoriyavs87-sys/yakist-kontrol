<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16302c;
  --ink-soft:#3d5952;
  --paper:#f5f3ed;
  --paper-card:#ffffff;
  --line:#dcd6c8;
  --teal:#1f5c52;
  --teal-deep:#12362f;
  --teal-tint:#e4ede9;
  --amber:#c8862b;
  --amber-tint:#faefdc;
  --red:#b3423a;
  --red-tint:#f7e6e3;
  --green:#2f7d4f;
  --green-tint:#e5f1e7;
  --radius:10px;
  --shadow:0 1px 2px rgba(22,48,44,0.06), 0 4px 16px rgba(22,48,44,0.06);
  font-family:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* Topbar */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--teal-deep);
  color:#fff;
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.topbar .stamp{
  width:30px;height:30px;border-radius:50%;
  border:2px solid #cfe3dd;display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;font-size:13px;flex-shrink:0;
}
.topbar .title{font-family:'Space Grotesk';font-weight:600;font-size:16px;letter-spacing:0.2px;}
.topbar .sub{font-size:11px;color:#b9d3cb;margin-top:1px;}
.topbar .who{font-size:12px;color:#cfe3dd;text-align:right;line-height:1.4;}
.topbar .who b{color:#fff;font-weight:600;}
.iconbtn{
  background:transparent;border:1px solid rgba(255,255,255,0.25);color:#fff;
  border-radius:8px;padding:6px 10px;font-size:12px;
}
.iconbtn:hover{background:rgba(255,255,255,0.12);}

main{flex:1;padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom));}

/* Cards */
.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card h2{font-size:16px;margin-bottom:12px;color:var(--teal-deep);}
.section-label{
  font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);
  font-weight:600;margin-bottom:6px;display:block;
}

/* Grid tiles for home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{
  background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 14px;text-align:left;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;min-height:108px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.tile:active{transform:scale(0.98);}
.tile .icon{font-size:22px;}
.tile .tlabel{font-family:'Space Grotesk';font-weight:600;font-size:14.5px;color:var(--teal-deep);}
.tile .tsub{font-size:11.5px;color:var(--ink-soft);}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:auto;padding:14px 16px;}
.tile.wide .icon{font-size:20px;}
.tile.accent{background:var(--teal);border-color:var(--teal);}
.tile.accent .tlabel,.tile.accent .tsub{color:#fff;}
.tile.accent .tsub{color:#cfe3dd;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:8px;padding:11px 18px;font-weight:600;font-size:14px;
  border:1px solid transparent;
}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-secondary{background:#fff;color:var(--teal-deep);border-color:var(--line);}
.btn-secondary:hover{background:var(--teal-tint);}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:transparent;}
.btn-danger{background:var(--red-tint);color:var(--red);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

/* Bottom nav */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;
  box-shadow:0 -2px 12px rgba(22,48,44,0.06);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav-inner{max-width:720px;width:100%;display:flex;}
.navbtn{
  flex:1;background:transparent;border:none;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-soft);font-size:10.5px;font-weight:600;
}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--teal);}

/* Forms */
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field{margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
  font-size:14.5px;color:var(--ink);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
textarea{resize:vertical;min-height:64px;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:9px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:600;color:var(--ink-soft);
}
.chip.selected{background:var(--teal);border-color:var(--teal);color:#fff;}
.segmented{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
.segmented button{flex:1;padding:10px;background:#fff;border:none;font-weight:600;font-size:13.5px;color:var(--ink-soft);border-right:1px solid var(--line);}
.segmented button:last-child{border-right:none;}
.segmented button.selected{background:var(--teal-tint);color:var(--teal-deep);}

/* Combobox / searchable select */
.combo{position:relative;}
.combo-input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14.5px;background:#fff;}
.combo-list{
  position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;
  border:1.5px solid var(--line);border-radius:8px;max-height:240px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(22,48,44,0.14);z-index:30;
}
.combo-item{padding:10px 12px;font-size:13.5px;border-bottom:1px solid #f0ede4;}
.combo-item:last-child{border-bottom:none;}
.combo-item:hover,.combo-item.hi{background:var(--teal-tint);}
.combo-item small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px;}
.combo-empty{padding:14px;font-size:13px;color:var(--ink-soft);text-align:center;}

/* Measurements list */
.meas-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.meas-row{display:flex;align-items:center;gap:8px;}
.meas-row input{flex:1;}
.meas-row .rm{
  width:34px;height:34px;flex-shrink:0;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;color:var(--red);font-size:16px;font-weight:700;
}
.add-meas{
  width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:8px;
  background:transparent;color:var(--teal-deep);font-weight:600;font-size:13px;
}

/* Compliance stamp select */
.compliance-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.comp-opt{
  border:1.5px solid var(--line);border-radius:9px;padding:11px 6px;text-align:center;
  background:#fff;
}
.comp-opt .cico{font-size:18px;display:block;margin-bottom:3px;}
.comp-opt .clabel{font-size:11.5px;font-weight:700;}
.comp-opt[data-v=ok].selected{background:var(--green-tint);border-color:var(--green);color:var(--green);}
.comp-opt[data-v=note].selected{background:var(--amber-tint);border-color:var(--amber);color:var(--amber);}
.comp-opt[data-v=fail].selected{background:var(--red-tint);border-color:var(--red);color:var(--red);}
.tolerance-hint{
  margin-top:8px;font-size:12px;padding:8px 10px;border-radius:7px;display:none;
}
.tolerance-hint.show{display:block;}
.tolerance-hint.ok{background:var(--green-tint);color:var(--green);}
.tolerance-hint.fail{background:var(--red-tint);color:var(--red);}

/* Table (report) */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:900px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--teal-tint);color:var(--teal-deep);font-weight:700;position:sticky;top:0;}
tr:last-child td{border-bottom:none;}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;display:inline-block;}
.badge.ok{background:var(--green-tint);color:var(--green);}
.badge.note{background:var(--amber-tint);color:var(--amber);}
.badge.fail{background:var(--red-tint);color:var(--red);}

/* Login */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% -10%, #1f5c52 0%, #12362f 55%, #0d2621 100%);}
.login-card{background:#fff;border-radius:16px;padding:30px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
.login-logo{width:52px;height:52px;border-radius:50%;background:var(--teal-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:20px;margin:0 auto 14px;}
.login-title{text-align:center;font-size:18px;margin-bottom:2px;}
.login-sub{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
.eng-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;margin-bottom:6px;}
.eng-item{
  padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;font-weight:600;font-size:14.5px;
  display:flex;align-items:center;justify-content:space-between;background:#fff;
}
.eng-item:hover{border-color:var(--teal);}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.pinpad button{padding:16px;font-size:19px;font-weight:600;border-radius:10px;border:1.5px solid var(--line);background:#fff;}
.pinpad button:active{background:var(--teal-tint);}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:16px 0 4px;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--teal);}
.pin-dot.filled{background:var(--teal);}
.pin-error{color:var(--red);font-size:12.5px;text-align:center;margin-top:6px;min-height:16px;}
.back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:4px;padding:0;}

/* Toast */
.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--teal-deep);color:#fff;padding:12px 20px;border-radius:10px;
  font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.25);
  opacity:0;transition:opacity .25s ease, transform .25s ease;z-index:100;pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Header of screens */
.screen-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.screen-head h1{font-size:19px;color:var(--teal-deep);}
.backbtn{
  width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);
}

/* Admin lists */
.list-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;
}
.list-item .li-name{font-weight:600;font-size:13.5px;}
.list-item .li-sub{font-size:11.5px;color:var(--ink-soft);}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1.5px solid var(--line);}
.tab{padding:10px 4px;font-weight:600;font-size:13.5px;color:var(--ink-soft);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--teal-deep);border-bottom-color:var(--teal);}

.empty-state{text-align:center;padding:36px 16px;color:var(--ink-soft);}
.empty-state .eic{font-size:32px;margin-bottom:10px;display:block;}

.pill-btn{padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.pill-btn.selected{background:var(--teal);border-color:var(--teal);color:#fff;}

.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.summary-box{background:var(--teal-tint);border-radius:9px;padding:12px;text-align:center;}
.summary-box .snum{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:var(--teal-deep);}
.summary-box .slab{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}
.summary-box.warn{background:var(--red-tint);}
.summary-box.warn .snum{color:var(--red);}

@media print{
  .topbar,.bottomnav,.no-print{display:none !important;}
}
</style>
</head>

function todayISO(){
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function nowTime(){
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-');
  return `${d}.${m}.${y}`;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, icon, duration){
  const t=document.getElementById('toast');
  t.innerHTML = (icon?`<span>${icon}</span>`:'')+`<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>t.classList.remove('show'), duration || 2400);
}

/* =========================================================
   FIRESTORE DATA — live listeners keep every open device in sync
   automatically, without needing to refresh the page.
   ========================================================= */
function rebuildCatalogProducts(){
  const overrides = state.catalogMeta.productOverrides || {};
  const merged = SEED_PRODUCTS.map(p=>{
    const o = overrides[p.code];
    return o ? Object.assign({}, p, {normValue:o.normValue, normUnit:o.normUnit}) : p;
  }).concat(state.catalogMeta.customProducts || []);
  const engineers = (state.catalogMeta.engineers || []).map(e=>
    (e.role!=='admin' && !e.section) ? Object.assign({}, e, {section:'27'}) : e
  );
  state.catalog = {
    products: merged,
    equipment: state.catalogMeta.equipment || [],
    engineers: engineers,
  };
}

function initLiveListeners(){
  return new Promise((resolve)=>{
    if(!firebaseReady){ resolve(); return; }
    let gotCatalog=false, gotRecords=false;
    const maybeResolve=()=>{ if(gotCatalog && gotRecords) resolve(); };

    onSnapshot(doc(db, CATALOG_COLLECTION, 'meta'), snap=>{
      const defaults = { productOverrides:{}, customProducts:[], equipment:[], engineers:[] };
      state.catalogMeta = snap.exists() ? Object.assign(defaults, snap.data()) : defaults;
      rebuildCatalogProducts();
      if(!gotCatalog){ gotCatalog=true; maybeResolve(); }
      else if(state.screen && state.screen!=='loading'){ render(); }
    }, err=>{
      console.error('catalog listener error', err);
      if(!gotCatalog){ state.catalogMeta = {productOverrides:{},customProducts:[],equipment:[],engineers:[]}; rebuildCatalogProducts(); gotCatalog=true; maybeResolve(); }
    });

    onSnapshot(collection(db, RECORDS_COLLECTION), snap=>{
      state.records = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(!gotRecords){ gotRecords=true; maybeResolve(); }
      else if(state.screen && state.screen!=='loading'){ render(); }
    }, err=>{
      console.error('records listener error', err);
      if(!gotRecords){ state.records=[]; gotRecords=true; maybeResolve(); }
    });
  });
}

async function saveCatalog(){
  if(!firebaseReady){ showToast('Немає з’єднання з базою даних.', '⚠️', 7000); return; }
  try{
    await setDoc(doc(db, CATALOG_COLLECTION, 'meta'), state.catalogMeta);
    state.catalogSaveFailed = false;
  }catch(e){
    console.error('save catalog failed', e);
    state.catalogSaveFailed = true;
    showToast('Не вдалося зберегти зміни в довіднику: '+(e && e.message ? e.message : 'помилка мережі. Спробуйте ще раз.'), '⚠️', 8000);
  }
}

// Records are saved one-by-one as their own documents (not one giant array) —
// this is both the correct way to use Firestore and avoids the "rewrite everything"
// failures we used to see with Claude's built-in storage.
async function saveNewRecord(record){
  if(!firebaseReady){ showToast('Немає з’єднання з базою даних. Запис не збережено.', '⚠️', 7000); return false; }
  try{
    await addDoc(collection(db, RECORDS_COLLECTION), record);
    return true;
  }catch(e){
    console.error('save record failed', e);
    showToast('Не вдалося зберегти запис: '+(e && e.message ? e.message : 'помилка мережі. Спробуйте ще раз.'), '⚠️', 8000);
    return false;
  }
}

/* =========================================================
   INIT
   ========================================================= */
async function init(){
  render(); // loading screen
  if(!firebaseReady){
    document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#8a352d;background:#f7e6e3;font-weight:600;">Не вдалося з'єднатися з базою даних Firebase. Перевірте інтернет-з'єднання й оновіть сторінку.</div>`;
    return;
  }
  await initLiveListeners();
  state.screen = 'login';
  render();
}

/* =========================================================
   RENDER ROOT
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  if(state.screen==='loading'){ app.innerHTML = renderLoading(); return; }
  if(state.screen==='login'){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }

  app.innerHTML = `
    ${renderTopbar()}
    ${state.catalogSaveFailed ? `<div style="background:#f7e6e3;color:#8a352d;font-size:12.5px;font-weight:600;padding:9px 16px;text-align:center;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;">
      <span>⚠️ Останні зміни в довіднику не збереглись — перевірте інтернет-з'єднання.</span>
      <button id="retry-save-catalog" class="btn btn-sm" style="background:#8a352d;color:#fff;">Спробувати ще раз</button>
    </div>` : ''}
    <main>${renderScreen()}</main>
    ${renderBottomNav()}
  `;
  attachScreenEvents();
  const retryBtn = document.getElementById('retry-save-catalog');
  if(retryBtn) retryBtn.onclick = async ()=>{
    retryBtn.disabled = true; retryBtn.textContent='Зберігаємо…';
    await saveCatalog();
    render();
  };
}

function renderLoading(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--teal-deep);font-family:'Space Grotesk';">Завантаження…</div>`;
}

/* =========================================================

   ========================================================= */
function renderTopbar(){
  const name = state.session ? state.session.name : '';
  const roleLabel = state.session && state.session.role==='admin' ? 'Начальник ВТК' : 'Зміна';
  return `
  <div class="topbar">
    <div class="brand">
      <div class="stamp">ЯК</div>
      <div>
        <div class="title">Контроль якості</div>
        <div class="sub">Проміжний і вихідний контроль</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="who">${roleLabel}<br><b>${esc(name)}</b></div>
      <button class="iconbtn" data-action="logout">Вийти</button>
    </div>
  </div>`;
}

function renderBottomNav(){
  const isAdmin = state.session && state.session.role==='admin';
  const items = [
    {k:'home', ic:'🏠', label:'Головна'},
    {k:'new', ic:'📝', label:'Новий запис'},
    {k:'report', ic:'📊', label:'Звіт'},
  ];
  if(isAdmin) items.push({k:'admin', ic:'⚙️', label:'Довідник'});
  return `<div class="bottomnav"><div class="bottomnav-inner">
    ${items.map(i=>`<button class="navbtn ${state.screen===i.k?'active':''}" data-nav="${i.k}">
      <span class="ic">${i.ic}</span><span>${i.label}</span>
    </button>`).join('')}
  </div></div>`;
}

function renderScreen(){
  if(state.screen==='admin' && !(state.session && state.session.role==='admin')){
    state.screen='home';
  }
  switch(state.screen){
    case 'home': return renderHome();
    case 'typepick': return renderTypePick();
    case 'new': return renderForm();
    case 'report': return renderReport();
    case 'admin': return renderAdmin();
    case 'actSaved': return renderActSaved();
    case 'acts': return renderActsList();
    default: return renderHome();
  }
}

/* =========================================================
   LOGIN
   ========================================================= */
function renderLogin(){
  const engineers = (state.catalog && state.catalog.engineers) || [];

  if(engineers.length===0){
    return `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">ЯК</div>
        <div class="login-title">Контроль якості фасування</div>
        <div class="login-sub">Список людей ще порожній</div>
        <div class="empty-state">
          <span class="eic">👤</span>
          Додайте перших людей через «Довідник» після налаштування.
        </div>
        <button class="btn btn-primary btn-block" data-action="bootstrap-admin">Налаштувати (без входу)</button>
      </div>
    </div>`;
  }

  if(state.loginStep==='section'){
    const sections = knownSections();
    const hasAdmin = engineers.some(e=>e.role==='admin');
    return `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">ЯК</div>
        <div class="login-title">Контроль якості фасування</div>
        <div class="login-sub">Оберіть дільницю</div>
        <div class="eng-list">
          ${sections.map(s=>`<button class="eng-item" data-pick-section="${esc(s)}"><span>Дільниця ${esc(s)}</span><span>→</span></button>`).join('')}
          <button class="eng-item" data-pick-admin="1"><span>Я — начальник ВТК</span><span>→</span></button>
        </div>
        ${!hasAdmin ? `<button class="back-link" data-action="bootstrap-admin" style="margin-top:16px;justify-content:center;width:100%;">Ще не додано жодного адміністратора — налаштувати</button>` : ''}
      </div>
    </div>`;
  }

  if(state.loginStep==='pick' || !state.loginEngineer){
    const group = state.loginGroup;
    const filtered = group && group.type==='admin'
      ? engineers.filter(e=>e.role==='admin')
      : engineers.filter(e=>(e.section||'')===(group?group.value:''));
    return `
    <div class="login-wrap">
      <div class="login-card">
        <button class="back-link" data-action="login-back-section">← Інша дільниця</button>
        <div class="login-title">${group && group.type==='admin' ? 'Начальник ВТК' : 'Дільниця '+esc(group.value)}</div>
        <div class="login-sub">Оберіть своє прізвище</div>
        ${filtered.length===0 ? `<div class="empty-state"><span class="eic">👤</span>Тут ще нікого не додано.</div>${group && group.type==='admin' ? `<button class="back-link" data-action="bootstrap-admin" style="justify-content:center;width:100%;">Налаштувати без входу</button>` : ''}` : `
          <div class="eng-list">
            ${filtered.map(e=>`<button class="eng-item" data-pick-eng="${esc(e.name)}"><span>${esc(e.name)}${e.role==='admin'?' <span class="badge ok" style="margin-left:4px;">Адмін</span>':''}</span><span>→</span></button>`).join('')}
          </div>
        `}
      </div>
    </div>`;
  }

  // pin step
  const dots = [0,1,2,3].map(i=>`<div class="pin-dot ${i<state.loginPin.length?'filled':''}"></div>`).join('');
  return `
  <div class="login-wrap">
    <div class="login-card">
      <button class="back-link" data-action="login-back">← Обрати іншого</button>
      <div class="login-logo">${esc(state.loginEngineer.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
      <div class="login-title">${esc(state.loginEngineer.name)}</div>
      <div class="login-sub">Введіть PIN-код</div>
      <div class="pin-dots">${dots}</div>
      <div class="pin-error">${esc(state.loginError)}</div>
      <div class="pinpad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join('')}
        <button data-pin="clear">✕</button>
        <button data-pin="0">0</button>
        <button data-pin="back">⌫</button>
      </div>
    </div>
  </div>`;
}

function attachLoginEvents(){
  document.querySelectorAll('[data-pick-section]').forEach(btn=>{
    btn.onclick = ()=>{
      state.loginGroup = {type:'section', value:btn.dataset.pickSection};
      state.loginStep='pick';
      render();
    };
  });
  const pickAdmin = document.querySelector('[data-pick-admin]');
  if(pickAdmin) pickAdmin.onclick = ()=>{
    state.loginGroup = {type:'admin'};
    state.loginStep='pick';
    render();
  };
  document.querySelectorAll('[data-pick-eng]').forEach(btn=>{
    btn.onclick = ()=>{
      const name = btn.dataset.pickEng;
      state.loginEngineer = state.catalog.engineers.find(e=>e.name===name);
      state.loginStep='pin'; state.loginPin=''; state.loginError='';
      render();
    };
  });
  const backSection = document.querySelector('[data-action="login-back-section"]');
  if(backSection) backSection.onclick = ()=>{ state.loginStep='section'; state.loginGroup=null; render(); };
  const back = document.querySelector('[data-action="login-back"]');
  if(back) back.onclick = ()=>{ state.loginStep='pick'; state.loginEngineer=null; render(); };
  const bootstrap = document.querySelector('[data-action="bootstrap-admin"]');
  if(bootstrap) bootstrap.onclick = ()=>{
    state.session = {name:'Адміністратор', role:'admin', section:''};
    state.screen='admin'; state.adminTab='engineers';
    render();
  };
  document.querySelectorAll('[data-pin]').forEach(btn=>{
    btn.onclick = ()=>{
      const v = btn.dataset.pin;
      if(v==='clear'){ state.loginPin=''; }
      else if(v==='back'){ state.loginPin = state.loginPin.slice(0,-1); }
      else if(state.loginPin.length<4){ state.loginPin += v; }
      state.loginError='';
      if(state.loginPin.length===4){
        if(state.loginPin === state.loginEngineer.pin){
          state.session = {name: state.loginEngineer.name, role: state.loginEngineer.role || 'engineer', section: state.loginEngineer.section || ''};
          state.screen='home'; state.loginStep='section'; state.loginPin=''; state.loginEngineer=null; state.loginGroup=null;
          render();
          return;
        } else {
          state.loginError = 'Невірний PIN-код';
          state.loginPin='';
        }
      }
      render();
    };
  });
}

function renderMiniRecord(r){
  const badge = r.compliance==='ok'?'ok':(r.compliance==='note'?'note':'fail');

  return `<div class="list-item">
    <div>
      <div class="li-name">${esc(r.productName)}</div>
      <div class="li-sub">${esc(r.time)} · партія ${esc(r.batch?fmtDate(r.batch):'—')} · ${controlTypeLabel(r.controlType)}${r.continuesFrom?' · ↳ продовження':''}</div>

    <span class="badge ${badge}">${badgeText}</span>
  </div>`;
}

function productsForType(type){
  return (state.catalog.products||[]).filter(p=>p.type===type);
}
function trademarksForType(type){
  const set = new Set(productsForType(type).map(p=>p.trademark).filter(Boolean));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'uk'));
}

// Resizes and compresses an uploaded photo to a small JPEG data URL so a few
// act photos comfortably fit within Firestore's 1MB document size limit.
function resizeImageFile(file, maxW, quality){
  maxW = maxW||900; quality = quality||0.55;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({data: canvas.toDataURL('image/jpeg', quality), w, h});
      };
      img.onerror = ()=>reject(new Error('Не вдалося прочитати зображення'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Не вдалося прочитати файл'));
    reader.readAsDataURL(file);
  });
}

// DSTU OIML R 87 — allowable negative deviation from nominal quantity in a packaging unit.
// Ranges are defined in grams/millilitres; kg/l are converted to that base before lookup.
// Positive deviation (overfill) is not limited by the standard.
function oimlAllowance(baseNorm){
  if(baseNorm <= 0) return null;
  if(baseNorm <= 50)    return {type:'pct', value:9};
  if(baseNorm <= 100)   return {type:'abs', value:4.5};
  if(baseNorm <= 200)   return {type:'pct', value:4.5};
  if(baseNorm <= 300)   return {type:'abs', value:9.0};
  if(baseNorm <= 500)   return {type:'pct', value:3};
  if(baseNorm <= 1000)  return {type:'abs', value:15.0};
  if(baseNorm <= 10000) return {type:'pct', value:1.5};
  return null; // outside standard's tabulated range — no automatic hint
}
function toBaseUnits(value, unit){
  // normalizes кг→г and л→мл so the OIML table (defined in g/ml) applies
  if(unit==='кг' || unit==='л') return value*1000;
  return value;
}
function fromBaseUnits(value, unit){
  if(unit==='кг' || unit==='л') return value/1000;
  return value;
}

// Converts raw entered measurements to netto-equivalent values, subtracting
// tare weight when the engineer measured brutto (product + packaging).
function nettoValues(f){
  const tare = parseFloat(f.tareWeight);
  const useTare = f.netBrutto==='brutto' && !isNaN(tare);
  return f.measurements
    .map(m=>parseFloat(m))
    .filter(v=>!isNaN(v))
    .map(v=> useTare ? (v - tare) : v);
}

function evalToleranceHint(f){
  const hintEl = document.getElementById('f-tol-hint');
  if(!hintEl) return;
  const norm = parseFloat(f.normValue);
  const vals = nettoValues(f);
  if(!norm || vals.length===0){ hintEl.className='tolerance-hint'; hintEl.textContent=''; return; }
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const baseNorm = toBaseUnits(norm, f.normUnit);
  const allowance = oimlAllowance(baseNorm);
  if(!allowance){
    hintEl.className='tolerance-hint show';
    hintEl.textContent = `Середній факт (нетто): ${avg.toFixed(2)} ${f.normUnit}. Норма поза табличним діапазоном ДСТУ OIML R87 — допуск визначте самостійно.`;
    return;
  }
  const allowedNegBase = allowance.type==='pct' ? baseNorm*allowance.value/100 : allowance.value;
  const lowerBoundBase = baseNorm - allowedNegBase;
  const lowerBound = fromBaseUnits(lowerBoundBase, f.normUnit);
  const within = avg >= lowerBound; // no upper limit per the standard
  const allowanceText = allowance.type==='pct' ? `мінус ${allowance.value}%` : `мінус ${allowance.value} г`;
  hintEl.className = 'tolerance-hint show '+(within?'ok':'fail');
  hintEl.textContent = `Допуск за ДСТУ OIML R87: ${allowanceText} → нижня межа ${lowerBound.toFixed(2)} ${f.normUnit} (перевищення норми не обмежене). Середній факт (нетто): ${avg.toFixed(2)} ${f.normUnit}. ${within?'В межах допуску — але рішення приймає інженер.':'Нижче допустимої межі — перевірте замір та внесіть рішення самостійно.'}`;
}

    <div style="display:flex;gap:8px;flex-wrap:wrap;">

  </div>

  <div class="card">
    <h2>Записи (${fmtDate(date)})</h2>
    ${recs.length===0 ? `<div class="empty-state"><span class="eic">🗂️</span>За цю дату записів немає.</div>` : `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Час</th>${isAdmin?'<th>Дільниця</th>':''}<th>Інженер</th><th>ТМ</th><th>Найменування</th><th>Партія</th><th>Термін</th>
          <th>Операція</th><th>Норма</th><th>Заміри</th><th>Н/Б</th><th>Відповідність</th>
          ${isGp?'<th>Зовн. вигляд</th><th>Дозвіл</th><th>Акт</th>':'<th>Обладнання</th>'}
          <th>Зауваження</th>
        </tr></thead>
        <tbody>
        ${recs.map(r=>`<tr>
          <td>${esc(r.time)}</td>
          ${isAdmin?`<td>${esc(recordSection(r))}</td>`:''}
          <td>${esc(r.engineer)}</td>
          <td>${esc(r.trademark)}</td>
          <td>${esc(r.productName)}${r.continuesFrom?' <span class="hint" style="display:inline;">↳ продовж.</span>':''}</td>
          <td>${esc(fmtDate(r.batch))}</td>
          <td>${esc(fmtDate(r.expiry))}</td>
          <td>${esc(opsLabel(r.ops))}</td>
          <td>${esc(r.normValue)} ${esc(r.normUnit)}</td>
          <td>${esc(displayMeasurements(r))}</td>
          <td>${r.netBrutto==='netto'?'Нетто':'Брутто'}</td>
          <td><span class="badge ${r.compliance}">${r.compliance==='ok'?'Відповідає':r.compliance==='note'?'Із зауваж.':'Не відп.'}</span></td>
          ${isGp?`
          <td><span class="badge ${r.appearanceOverall||''}">${appearanceLabel(r.appearanceOverall)}</span></td>
          <td>${r.permit?esc(r.permit.number||'так'):'—'}</td>
          <td>${r.act?`<button class="btn btn-sm btn-danger" data-download-act="${esc(r.id)}">⬇️ №${esc(r.act.number||'')}</button>`:'—'}</td>
          `:`<td>${esc(r.equipment||'—')}</td>`}
          <td>${esc(r.comment||'—')}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>`}
  </div>
  `;
}

function buildReportText(recs, date){
  const isGp = state.reportControlType==='gp';
  let lines = [`ЗВІТ КОНТРОЛЮ ЯКОСТІ — ${isGp?'ГОТОВА ПРОДУКЦІЯ':'ПРОМІЖНИЙ КОНТРОЛЬ'} — ${fmtDate(date)}`, ''];
  recs.forEach((r,i)=>{
    lines.push(`${i+1}. [${r.time}] Дільниця ${recordSection(r)} — ${r.trademark} ${r.productName}`);
    lines.push(`   Інженер: ${r.engineer} | Партія: ${fmtDate(r.batch)} | Термін: ${fmtDate(r.expiry)}`);
    lines.push(`   Операція: ${opsLabel(r.ops)||'—'} | Норма: ${r.normValue} ${r.normUnit} (${r.netBrutto==='netto'?'нетто':'брутто'})`);
    lines.push(`   Заміри (нетто): ${displayMeasurements(r)||'—'}`);
    lines.push(`   Відповідність: ${r.compliance==='ok'?'Відповідає':r.compliance==='note'?'Із зауваженням':'Не відповідає'}${r.equipment?` | Обладнання: ${r.equipment}`:''}`);
    if(isGp){
      lines.push(`   Зовнішній вигляд: ${appearanceLabel(r.appearanceOverall)}`);
      if(r.permit) lines.push(`   Дозвіл на відхилення: №${r.permit.number} від ${fmtDate(r.permit.date)} — ${r.permit.desc||''}`);
      if(r.act) lines.push(`   АКТ НЕВІДПОВІДНОСТІ №${r.act.number} від ${fmtDate(r.act.date)}: ${r.act.desc}${r.act.actions?` | Заходи: ${r.act.actions}`:''}`);
    }
    if(r.comment) lines.push(`   Зауваження: ${r.comment}`);
    lines.push('');
  });
  return lines.join('\n');
}

function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  let worked = true;
  try{
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){ worked = false; }
  // Fallback for sandboxes that block the download attribute: open in a new tab
  setTimeout(()=>{
    try{ window.open(url, '_blank'); }catch(e){}
  }, worked ? 400 : 0);
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

async function exportXLSX(recs, date){
  if(!window.XLSX){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  }
  const isGp = state.reportControlType==='gp';
  const rows = recs.map(r=>{
    const row = {
      'Час': r.time, 'Дільниця': recordSection(r), 'Інженер': r.engineer,
      'Торгова марка': r.trademark, 'Найменування': r.productName, 'Код': r.productCode,
      'Партія': fmtDate(r.batch), 'Термін придатності': fmtDate(r.expiry),
      'Операція': opsLabel(r.ops),
      'Норма': r.normValue, 'Одиниця': r.normUnit,
      'Заміри (нетто)': displayMeasurements(r),
      'Нетто/Брутто': r.netBrutto==='netto'?'Нетто':'Брутто',
      'Відповідність': r.compliance==='ok'?'Відповідає':r.compliance==='note'?'Із зауваженням':'Не відповідає',
    };
    if(isGp){
      row['Зовнішній вигляд'] = appearanceLabel(r.appearanceOverall);
      row['Дозвіл на відхилення'] = r.permit ? `№${r.permit.number} від ${fmtDate(r.permit.date)} — ${r.permit.desc||''}` : '';
      row['Акт невідповідності'] = r.act ? `№${r.act.number} від ${fmtDate(r.act.date)}: ${r.act.desc}${r.act.actions?` | Заходи: ${r.act.actions}`:''}` : '';
    } else {
      row['Обладнання'] = r.equipment||'';
    }
    row['Зауваження'] = r.comment||'';
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]||{}).map(()=>({wch:16}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Звіт');
  const arrayBuf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([arrayBuf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  saveBlob(blob, `Звіт_${isGp?'ГП':'проміжний'}_${date}.xlsx`);
}

async function exportPDF(recs, date){
  if(!window.jspdf){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  }
  if(!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable)){

  }
  const isGp = state.reportControlType==='gp';
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  // jsPDF's built-in fonts don't cover Cyrillic — without this, Ukrainian text renders as garbled symbols.
  doc.addFileToVFS('NotoSans-Regular.ttf', NOTOSANS_FONT_B64);
  doc.addFont('NotoSans-Regular.ttf', 'NotoSans', 'normal');
  doc.setFont('NotoSans');
  doc.setFontSize(13);
  doc.text(`Звіт контролю якості — ${isGp?'готова продукція':'проміжний контроль'} — ${fmtDate(date)}`, 14, 14);
  const head = [['Час','Дільниця','Інженер','ТМ','Найменування','Партія','Термін','Операція','Норма','Заміри','Н/Б','Відповідність',
    ...(isGp?['Зовн. вигляд','Дозвіл','Акт']:['Обладнання']),'Зауваження']];
  const body = recs.map(r=>[
    r.time, recordSection(r), r.engineer, r.trademark, r.productName,
    fmtDate(r.batch), fmtDate(r.expiry),
    opsLabel(r.ops),
    `${r.normValue} ${r.normUnit}`,
    displayMeasurements(r),
    r.netBrutto==='netto'?'Н':'Б',
    r.compliance==='ok'?'Відповідає':r.compliance==='note'?'Із зауваж.':'Не відповідає',
    ...(isGp?[
      appearanceLabel(r.appearanceOverall),
      r.permit?`№${r.permit.number}`:'—',
      r.act?`№${r.act.number}`:'—',
    ]:[r.equipment||'']),
    r.comment||'',
  ]);
  doc.autoTable({
    head, body, startY:20,
    styles:{fontSize:7, font:'NotoSans'},
    headStyles:{fillColor:[31,92,82], font:'NotoSans', fontStyle:'normal'},
    bodyStyles:{font:'NotoSans'},
  });
  const blob = doc.output('blob');
  saveBlob(blob, `Звіт_${isGp?'ГП':'проміжний'}_${date}.pdf`);
}

// Renders a single non-compliance act (F-QC-8.7/10-05) as its own downloadable
// PDF document, laid out with real bordered tables and vector checkbox squares —
// matching the structure of the official paper form as closely as possible.
async function downloadActPDF(record){
  if(!window.jspdf){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  }
  if(!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable)){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
  doc.addFileToVFS('NotoSans-Regular.ttf', NOTOSANS_FONT_B64);
  doc.addFont('NotoSans-Regular.ttf', 'NotoSans', 'normal');
  doc.setFont('NotoSans');

  const a = record.act || {};
  const marginL = 40, marginR = 555;
  const fullW = marginR - marginL;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  let y = 40;
  let sectionNum = 0;

  // Draws a real vector checkbox square (not a font glyph) so it never depends
  // on which symbols happen to be in the embedded font.
  const drawCheckbox = (cx, cy, checked)=>{
    const s = 7.5;
    doc.setDrawColor(60,60,60);
    doc.setLineWidth(0.6);
    doc.rect(cx-s/2, cy-s/2, s, s);
    if(checked){
      doc.setDrawColor(178,52,42);
      doc.setLineWidth(1.1);
      doc.line(cx-s/2+1.2, cy-s/2+1.2, cx+s/2-1.2, cy+s/2-1.2);
      doc.line(cx-s/2+1.2, cy+s/2-1.2, cx+s/2-1.2, cy-s/2+1.2);
      doc.setLineWidth(0.6);
    }
  };

  const sectionTitle = (text)=>{
    sectionNum++;
    doc.setFontSize(10);
    doc.setTextColor(255,255,255);
    doc.setFillColor(18,54,47);
    doc.rect(marginL, y, fullW, 17, 'F');
    doc.text(`${sectionNum}. ${text}`, marginL+fullW/2, y+11.8, {align:'center'});
    y += 17;
    doc.setTextColor(20,20,20);
  };
  const subLabel = (text)=>{
    doc.setFontSize(8.5);
    doc.setFont('NotoSans','normal');
    doc.setTextColor(60,60,60);
    doc.text(text, marginL+4, y+11);
    y += 15;
    doc.setTextColor(20,20,20);
  };

  // Single-row checkbox grid — one column per item, label above, checkbox below.
  // Used for Стадія / Причина / Статус (matches the original's wide-row style).
  const checkboxGridRow = (items, selectedIds)=>{
    doc.autoTable({
      head:[items.map(it=>it.label)],
      body:[items.map(()=>'')],
      startY:y, margin:{left:marginL, right:pageW-marginR},
      styles:{font:'NotoSans', fontSize:6.2, cellPadding:3, lineColor:[190,190,190], lineWidth:0.5, valign:'top'},
      headStyles:{fillColor:[240,242,240], textColor:[20,20,20], fontStyle:'normal'},
      bodyStyles:{minCellHeight:16},
      theme:'grid',
      didDrawCell: (data)=>{
        if(data.section==='body'){
          const item = items[data.column.index];
          const checked = item && selectedIds.includes(item.id);
          drawCheckbox(data.cell.x+data.cell.width/2, data.cell.y+data.cell.height/2, checked);
        }
      },
    });
    y = doc.lastAutoTable.finalY;
  };

  // Two-column checklist — label with an inline checkbox at the end of each row,
  // items split into a left and right column. Matches "Вид невідповідності".
  const checklistTwoCol = (items, selectedIds)=>{
    const half = Math.ceil(items.length/2);
    const left = items.slice(0, half), right = items.slice(half);
    const rows = Math.max(left.length, right.length);
    const body = [];
    for(let i=0;i<rows;i++) body.push([left[i]?left[i].label:'', '', right[i]?right[i].label:'', '']);
    doc.autoTable({
      body, startY:y, margin:{left:marginL, right:pageW-marginR},
      styles:{font:'NotoSans', fontSize:8, cellPadding:4, lineColor:[190,190,190], lineWidth:0.5, valign:'middle'},
      columnStyles:{0:{cellWidth:220},1:{cellWidth:35,halign:'center'},2:{cellWidth:'auto'},3:{cellWidth:35,halign:'center'}},
      theme:'grid',
      didDrawCell: (data)=>{
        if(data.column.index===1 || data.column.index===3){
          const arr = data.column.index===1 ? left : right;
          const item = arr[data.row.index];
          if(!item) return;
          drawCheckbox(data.cell.x+data.cell.width/2, data.cell.y+data.cell.height/2, selectedIds.includes(item.id));
        }
      },
    });
    y = doc.lastAutoTable.finalY;
  };

  const infoTable = (rows)=>{
    doc.autoTable({
      body: rows.map(([label,value])=>[label, value||'—']),
      startY:y, margin:{left:marginL, right:pageW-marginR},
      styles:{font:'NotoSans', fontSize:8.5, cellPadding:5, lineColor:[190,190,190], lineWidth:0.5, valign:'top'},
      columnStyles:{0:{cellWidth:170, fontStyle:'normal', textColor:[100,110,107]}, 1:{fontStyle:'normal'}},
      theme:'grid',
    });
    y = doc.lastAutoTable.finalY;
  };
  const textBox = (label, value)=>{
    subLabel(label);
    doc.autoTable({
      body: [[value || '—']],
      startY:y, margin:{left:marginL, right:pageW-marginR},
      styles:{font:'NotoSans', fontSize:9, cellPadding:6, lineColor:[190,190,190], lineWidth:0.5},
      theme:'grid',
    });
    y = doc.lastAutoTable.finalY;
  };
  const signRow = (label, position, name, extraHead, extraVal)=>{
    sectionTitle(label);
    doc.autoTable({
      head:[extraHead ? ['Посада','ПІБ','Підпис',extraHead] : ['Посада','ПІБ','Підпис']],
      body:[extraHead ? [position||'—', name||'—', '', extraVal] : [position||'—', name||'—', '']],
      startY:y, margin:{left:marginL, right:pageW-marginR},
      styles:{font:'NotoSans', fontSize:8.5, cellPadding:5, lineColor:[190,190,190], lineWidth:0.5},
      headStyles:{fillColor:[240,242,240], textColor:[20,20,20], fontStyle:'normal'},
      theme:'grid',
    });
    y = doc.lastAutoTable.finalY;
  };

  // Header — bordered box: logo + title on the left, Дата/№/Сторінка meta table on the right
  doc.autoTable({
    body: [
      [{content:'', rowSpan:3}, 'Дата:', fmtDate(a.date)],
      ['№ повідомлення:', a.number||'—'],
      ['Сторінка / Сторінок:', 'Сторінка 1 з 1'],
    ],
    startY:y, margin:{left:marginL, right:pageW-marginR},
    styles:{font:'NotoSans', fontSize:9, cellPadding:5, lineColor:[190,190,190], lineWidth:0.5, valign:'middle'},
    columnStyles:{0:{cellWidth:335}, 1:{cellWidth:100, textColor:[90,90,90]}, 2:{cellWidth:'auto'}},
    theme:'grid',
    didDrawCell: (data)=>{
      if(data.column.index===0 && data.row.index===0){
        try{ doc.addImage(COMPANY_LOGO_B64, 'PNG', data.cell.x+6, data.cell.y+8, 46, 35); }catch(e){ console.warn('logo embed failed', e); }
        doc.setFontSize(8);
        doc.setTextColor(120,120,120);
        doc.text('GMP ISO 22716 · QMS ISO 9001', data.cell.x+60, data.cell.y+16);
        doc.setTextColor(20,20,20);
        doc.setFontSize(10.5);
        const tLines = doc.splitTextToSize('Повідомлення про невідповідність продукції / напівфабрикату', data.cell.width-66);
        doc.text(tLines, data.cell.x+60, data.cell.y+29);
      }
    },
  });
  y = doc.lastAutoTable.finalY;

  sectionTitle('Стадія виявлення невідповідності');
  checkboxGridRow(ACT_DISCOVERY_STAGES, a.discoveryStage?[a.discoveryStage]:[]);

  sectionTitle('Ідентифікація ГП / Напівфабрикату');
  infoTable([
    ['Найменування ГП/Напівфабрикату', `${record.trademark} ${record.productName}`],
    ['Артикул / Складський код', record.productCode],
    ['№ Специфікації / № форми виробництва', a.specNumber],
    ['Дата виготовлення напівфабрикату', fmtDate(a.semiDate)],
    ['№ Партії ГП', fmtDate(record.batch)],
    ['Загальна кількість партії', a.totalQty ? `${a.totalQty} ${a.totalQtyUnit}` : '—'],
    ['Кількість невідповідної продукції', a.defectQty ? `${a.defectQty} ${a.defectQtyUnit}` : '—'],
  ]);

  sectionTitle('Вид невідповідності');
  checklistTwoCol(ACT_NONCOMPLIANCE_TYPES, a.nonComplianceTypes||[]);
  if((a.nonComplianceTypes||[]).includes('other')){
    infoTable([['Інше (уточнення)', a.nonComplianceOther]]);
  }
  textBox('Вид невідповідності (Опис дефекту / норма-факт)', a.desc);

  signRow('Підготував', 'Інженер з якості', record.engineer);

  sectionTitle('Причина невідповідності');
  checkboxGridRow(ACT_CAUSE_CATEGORIES, a.causeCategories||[]);
  textBox('Детальний опис причини невідповідності', a.causeDetail);

  signRow('Відповідальний за висновок', a.responsiblePosition||'Начальник виробництва', a.responsibleName);

  sectionTitle('Статус');
  checkboxGridRow(ACT_STATUS_OPTIONS, a.statusOptions||[]);

  if(a.actions) textBox('Додаткові примітки', a.actions);

  signRow('Статус присвоїв', 'Інженер з якості', a.assignedBy||record.engineer, 'Дата:', fmtDate(a.date));

  y += 14;
  doc.setFontSize(7.5);
  doc.setTextColor(140,140,140);
  doc.text('F-QC-8.7/10-05', marginL, y);

  // Photo evidence — each photo on its own page, scaled to fit within margins
  if(a.photos && a.photos.length){
    a.photos.forEach(p=>{
      doc.addPage();
      doc.setFont('NotoSans');
      doc.setFontSize(10);
      doc.setTextColor(20,20,20);
      doc.text(`Фото невідповідності — № ${a.number||''}`, marginL, 36);
      const maxW = fullW, maxH = pageH - 90;
      let w = p.w, h = p.h;
      const scale = Math.min(maxW/w, maxH/h, 1);
      w *= scale; h *= scale;
      try{ doc.addImage(p.data, 'JPEG', marginL + (maxW-w)/2, 56, w, h); }
      catch(e){ console.warn('photo embed failed', e); }
    });
  }

  const blob = doc.output('blob');
  saveBlob(blob, `Акт_${(a.number||'без_номера').replace(/[\/\\]/g,'-')}_${record.date}.pdf`);
}

// Renders the same act as an editable Word (.docx) document, so engineers can
// open it in Word afterwards to add a signature, fix a typo, etc.
async function downloadActDOCX(record){
  if(!window.docx){
    await loadScript('https://cdn.jsdelivr.net/npm/docx@8.5/build/index.umd.min.js');
  }
  const {
    Document, Paragraph, Table, TableRow, TableCell, TextRun, ImageRun, Packer,
    WidthType, AlignmentType, ShadingType, VerticalAlign, BorderStyle
  } = window.docx;

  const a = record.act || {};
  const CELL_MARGIN = {top:60, bottom:60, left:80, right:80};
  const BORDER = { style: BorderStyle.SINGLE, size: 2, color: 'BEBEBE' };
  const ALL_BORDERS = { top:BORDER, bottom:BORDER, left:BORDER, right:BORDER };

  const cell = (text, opts)=>{
    opts = opts||{};
    return new TableCell({
      width: opts.width ? {size:opts.width, type:WidthType.DXA} : undefined,
      columnSpan: opts.colSpan, rowSpan: opts.rowSpan,
      verticalAlign: VerticalAlign.CENTER,
      margins: CELL_MARGIN,
      borders: ALL_BORDERS,
      shading: opts.fill ? {type:ShadingType.CLEAR, fill:opts.fill} : undefined,
      children: [new Paragraph({
        alignment: opts.align || AlignmentType.LEFT,
        children: [new TextRun({text: String(text==null?'':text), bold: !!opts.bold, color: opts.color, size: opts.size||18})],
      })],
    });
  };
  const checkboxCell = (checked, width)=> new TableCell({
    width: {size:width, type:WidthType.DXA},
    verticalAlign: VerticalAlign.CENTER,
    margins: CELL_MARGIN,
    borders: ALL_BORDERS,
    children: [new Paragraph({
      alignment: AlignmentType.CENTER,
      children: [new TextRun({text: checked ? '☒' : '☐', size: 22, color: checked ? 'B23429' : '3C3C3C', bold: checked})],
    })],
  });
  const sectionTitleEl = (num, text)=> new Table({
    width:{size:100, type:WidthType.PERCENTAGE},
    rows:[new TableRow({children:[
      new TableCell({
        borders: ALL_BORDERS,
        shading:{type:ShadingType.CLEAR, fill:'12362F'},
        margins: CELL_MARGIN,
        children:[new Paragraph({alignment:AlignmentType.CENTER, children:[new TextRun({text: num+'. '+text, bold:true, color:'FFFFFF', size:19})]})],
      }),
    ]}),
  ]});
  const subLabelEl = (text)=> new Paragraph({spacing:{before:80,after:40}, children:[new TextRun({text, size:17, color:'3C3C3C'})]});
  const checkboxGridRow = (items, selectedIds)=>{
    const w = Math.floor(9350/items.length);
    return new Table({
      width:{size:100, type:WidthType.PERCENTAGE},
      rows:[
        new TableRow({children: items.map(it=>cell(it.label, {width:w, fill:'F0F2F0', size:12}))}),
        new TableRow({children: items.map(it=>checkboxCell(selectedIds.includes(it.id), w))}),
      ],
    });
  };
  const checklistTwoCol = (items, selectedIds)=>{
    const half = Math.ceil(items.length/2);
    const left = items.slice(0,half), right = items.slice(half);
    const rows = [];
    for(let i=0;i<Math.max(left.length,right.length);i++){
      rows.push(new TableRow({children:[
        cell(left[i]?left[i].label:'', {width:4200, size:16}),
        checkboxCell(left[i]?selectedIds.includes(left[i].id):false, 500),
        cell(right[i]?right[i].label:'', {width:4200, size:16}),
        checkboxCell(right[i]?selectedIds.includes(right[i].id):false, 500),
      ]}));
    }
    return new Table({width:{size:100,type:WidthType.PERCENTAGE}, rows});
  };
  const infoTableEl = (rows)=> new Table({
    width:{size:100, type:WidthType.PERCENTAGE},
    rows: rows.map(([label,value])=>new TableRow({children:[
      cell(label, {width:3000, color:'64645F', size:16}),
      cell(value||'—', {width:6350, size:17}),
    ]})),
  });
  const textBoxEl = (value)=> new Table({width:{size:100,type:WidthType.PERCENTAGE}, rows:[new TableRow({children:[cell(value||'—',{size:17})]})]});
  const signRowEl = (position, name, extraLabel, extraVal)=>{
    const head = ['Посада','ПІБ','Підпис'];
    const body = [position||'—', name||'—', ''];
    if(extraLabel){ head.push(extraLabel); body.push(extraVal); }
    const w = Math.floor(9350/head.length);
    return new Table({width:{size:100,type:WidthType.PERCENTAGE}, rows:[
      new TableRow({children: head.map(h=>cell(h,{width:w, fill:'F0F2F0', bold:true, size:16}))}),
      new TableRow({children: body.map(b=>cell(b,{width:w, size:17}))}),
    ]});
  };

  // Fetch the embedded logo (data URL) as raw bytes for ImageRun
  const logoBytes = await (await fetch(COMPANY_LOGO_B64)).arrayBuffer();

  const children = [];
  children.push(new Table({
    width:{size:100, type:WidthType.PERCENTAGE},
    rows:[
      new TableRow({children:[
        new TableCell({rowSpan:3, width:{size:5500,type:WidthType.DXA}, borders:ALL_BORDERS, margins:CELL_MARGIN, verticalAlign:VerticalAlign.CENTER, children:[
          new Paragraph({children:[new ImageRun({data: logoBytes, transformation:{width:70, height:53}, type:'png'})]}),
          new Paragraph({children:[new TextRun({text:'GMP ISO 22716 · QMS ISO 9001', size:14, color:'787878'})]}),
          new Paragraph({children:[new TextRun({text:'Повідомлення про невідповідність продукції / напівфабрикату', bold:true, size:19})]}),
        ]}),
        cell('Дата:', {width:1700, color:'5A5A5A', size:16}),
        cell(fmtDate(a.date), {width:2150, size:17}),
      ]}),
      new TableRow({children:[cell('№ повідомлення:', {width:1700, color:'5A5A5A', size:16}), cell(a.number||'—', {width:2150, size:17})]}),
      new TableRow({children:[cell('Сторінка / Сторінок:', {width:1700, color:'5A5A5A', size:16}), cell('Сторінка 1 з 1', {width:2150, size:17})]}),
    ],
  }));
  children.push(new Paragraph({text:''}));

  children.push(sectionTitleEl(1, 'Стадія виявлення невідповідності'));
  children.push(checkboxGridRow(ACT_DISCOVERY_STAGES, a.discoveryStage?[a.discoveryStage]:[]));
  children.push(new Paragraph({text:''}));

  children.push(sectionTitleEl(2, 'Ідентифікація ГП / Напівфабрикату'));
  children.push(infoTableEl([
    ['Найменування ГП/Напівфабрикату', `${record.trademark} ${record.productName}`],
    ['Артикул / Складський код', record.productCode],
    ['№ Специфікації / № форми виробництва', a.specNumber],
    ['Дата виготовлення напівфабрикату', fmtDate(a.semiDate)],
    ['№ Партії ГП', fmtDate(record.batch)],
    ['Загальна кількість партії', a.totalQty ? `${a.totalQty} ${a.totalQtyUnit}` : '—'],
    ['Кількість невідповідної продукції', a.defectQty ? `${a.defectQty} ${a.defectQtyUnit}` : '—'],
  ]));
  children.push(new Paragraph({text:''}));

  children.push(sectionTitleEl(3, 'Вид невідповідності'));
  children.push(checklistTwoCol(ACT_NONCOMPLIANCE_TYPES, a.nonComplianceTypes||[]));
  if((a.nonComplianceTypes||[]).includes('other')){
    children.push(subLabelEl('Інше (уточнення): ' + (a.nonComplianceOther||'—')));
  }
  children.push(subLabelEl('Вид невідповідності (Опис дефекту / норма-факт):'));
  children.push(textBoxEl(a.desc));
  children.push(new Paragraph({text:''}));

  children.push(sectionTitleEl(4, 'Підготував'));
  children.push(signRowEl('Інженер з якості', record.engineer));
  children.push(new Paragraph({text:''}));

  children.push(sectionTitleEl(5, 'Причина невідповідності'));
  children.push(checkboxGridRow(ACT_CAUSE_CATEGORIES, a.causeCategories||[]));
  children.push(subLabelEl('Детальний опис причини невідповідності:'));
  children.push(textBoxEl(a.causeDetail));
  children.push(new Paragraph({text:''}));

  children.push(sectionTitleEl(6, 'Відповідальний за висновок'));
  children.push(signRowEl(a.responsiblePosition||'Начальник виробництва', a.responsibleName));
  children.push(new Paragraph({text:''}));

  children.push(sectionTitleEl(7, 'Статус'));
  children.push(checkboxGridRow(ACT_STATUS_OPTIONS, a.statusOptions||[]));
  children.push(new Paragraph({text:''}));

  if(a.actions){
    children.push(subLabelEl('Додаткові примітки:'));
    children.push(textBoxEl(a.actions));
    children.push(new Paragraph({text:''}));
  }

  children.push(sectionTitleEl(8, 'Статус присвоїв'));
  children.push(signRowEl('Інженер з якості', a.assignedBy||record.engineer, 'Дата:', fmtDate(a.date)));
  children.push(new Paragraph({text:''}));
  children.push(new Paragraph({children:[new TextRun({text:'F-QC-8.7/10-05', size:14, color:'8C8C8C'})]}));

  // Photo evidence, each on its own page
  if(a.photos && a.photos.length){
    for(const p of a.photos){
      const bytes = await (await fetch(p.data)).arrayBuffer();
      const maxW = 500;
      const scale = Math.min(1, maxW/p.w);
      children.push(new Paragraph({pageBreakBefore:true, children:[new TextRun({text:`Фото невідповідності — № ${a.number||''}`, bold:true, size:19})]}));
      children.push(new Paragraph({children:[new ImageRun({data:bytes, transformation:{width:p.w*scale, height:p.h*scale}, type:'jpg'})]}));
    }
  }

  const wordDoc = new Document({sections:[{children}]});
  const blob = await Packer.toBlob(wordDoc);
  saveBlob(blob, `Акт_${(a.number||'без_номера').replace(/[\/\\]/g,'-')}_${record.date}.docx`);
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){ resolve(); return; }
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('Не вдалося завантажити бібліотеку: '+src));
    document.head.appendChild(s);
  });
}
